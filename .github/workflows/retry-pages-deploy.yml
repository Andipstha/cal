name: Retry failed Pages deploy

on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun-failed-deploy:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-latest
    steps:
      - name: Check whether deploy job failed
        id: failed-deploy
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --paginate \
            | jq -e '.jobs[] | select(.name == "deploy" and .conclusion == "failure")' >/dev/null; then
            echo "retry=true" >> "$GITHUB_OUTPUT"
          else
            echo "retry=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-run failed jobs once
        if: steps.failed-deploy.outputs.retry == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh api --method POST "repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs"
