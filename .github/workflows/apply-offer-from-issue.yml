name: Apply Offer Update from Issue

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  apply-offer:
    # Only act on issues created via the "Update an Offer" form (it auto-labels
    # "offer-update"), and only from people GitHub recognises as repo
    # owner/member/collaborator -- this is what stops a random person opening
    # an issue on a public repo from silently editing your live offers.
    if: >
      contains(github.event.issue.labels.*.name, 'offer-update') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse issue and update offers.json
        id: apply
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/apply_offer_from_issue.py

      - name: Commit offers.json
        if: steps.apply.outputs.result == 'ok'
        run: |
          git config user.name "bigmart-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add offers.json
          git commit -m "Offer update via issue #${{ github.event.issue.number }}"
          git push

      - name: Comment success and close issue
        if: steps.apply.outputs.result == 'ok'
        uses: actions/github-script@v7
        env:
          # Passed as an env var, NOT interpolated into the script text --
          # the message can contain user-submitted offer text (backticks,
          # quotes, ${}), so template-substituting it directly into the JS
          # source would be a script-injection risk on the runner.
          RESULT_MESSAGE: ${{ steps.apply.outputs.message }}
        with:
          script: |
            const message = process.env.RESULT_MESSAGE;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ ${message}\n\nThe calendar will update automatically within a few minutes. Closing this issue.`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed",
            });

      - name: Comment validation error (leave open for edit)
        if: steps.apply.outputs.result == 'error'
        uses: actions/github-script@v7
        env:
          RESULT_MESSAGE: ${{ steps.apply.outputs.message }}
        with:
          script: |
            const message = process.env.RESULT_MESSAGE;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `⚠️ ${message}\n\nEdit this issue (use the "Edit" option on your original description) to fix it -- no need to open a new one.`,
            });

  reject-unauthorized:
    # Politely close offer-update issues from anyone who isn't a recognised
    # team member, so untrusted submissions don't just sit open silently.
    if: >
      contains(github.event.issue.labels.*.name, 'offer-update') &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Thanks for the interest -- offer updates are limited to the Bigmart team. If you're staff and seeing this, ask an admin to add you as a repo collaborator.",
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed",
              state_reason: "not_planned",
            });
